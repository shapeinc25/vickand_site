<!-- @defaults {"title": "[Title]", "description": "[Description]", "googlePlay": "#", "appStore": "#"} -->
<article class="product" data-reveal>
  <div class="product-mocks"><div class="product-mock"><img class="mock-default" src="@/assets/images/phone-mock.svg" alt="" width="280" height="518" loading="lazy" decoding="async"><span class="mock-screen" aria-hidden="true"><span class="mock-bg" style="--banner: none"></span><p>[Mobile mockup]</p></span></div><div class="product-mock is-raised"><img class="mock-default" src="@/assets/images/phone-mock.svg" alt="" width="280" height="518" loading="lazy" decoding="async"><span class="mock-screen" aria-hidden="true"><span class="mock-bg" style="--banner: none"></span><p>[Mobile mockup]</p></span></div><div class="product-mock"><img class="mock-default" src="@/assets/images/phone-mock.svg" alt="" width="280" height="518" loading="lazy" decoding="async"><span class="mock-screen" aria-hidden="true"><span class="mock-bg" style="--banner: none"></span><p>[Mobile mockup]</p></span></div></div>
  <div class="product-dots" aria-label="Mockups"><button type="button" class="is-active" aria-label="Mockup 1"></button><button type="button" aria-label="Mockup 2"></button><button type="button" aria-label="Mockup 3"></button></div>
  <div class="product-info">
    <h3 class="product-title">{{title}}</h3>
    <p class="product-desc">{{description}}</p>
    <div class="store-ctas">
      <a class="store-badge" href="{{googlePlay}}" aria-label="Get it on Google Play"><img src="@/assets/images/badge-google-play.svg" alt="Get it on Google Play" width="120" height="40" loading="lazy" decoding="async"></a>
      <a class="store-badge" href="{{appStore}}" aria-label="Download on the App Store"><img src="@/assets/images/badge-app-store.svg" alt="Download on the App Store" width="120" height="40" loading="lazy" decoding="async"></a>
    </div>
  </div>
</article>
