<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{siteUrl}}{{path}}">
<meta name="theme-color" content="{{themeColor}}">
<link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- the two faces the first screen needs: fetched together with the CSS instead of after it -->
<link rel="preload" href="@/assets/fonts/zilla-slab-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="@/assets/fonts/changa-one-400.woff2" as="font" type="font/woff2" crossorigin>

<meta property="og:type" content="website">
<meta property="og:site_name" content="Vickand">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{siteUrl}}{{path}}">
<meta property="og:image" content="{{siteUrl}}og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Vickand: we build apps’n’games and improve the UX of yours">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{siteUrl}}og-image.png">
